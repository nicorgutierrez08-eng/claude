<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta name="description" content="Movi — rank movies by picking which one you liked more. Follow friends, compare taste and find what to watch next.">
  <meta property="og:title" content="Movi">
  <meta property="og:description" content="Stop rating movies. Start ranking them.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Movi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23161616'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23e5484d' font-family='Arial Black'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">movi</a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <div class="topright" id="topright"></div>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>

  <main id="view" class="view">
    <div class="loading"><div class="reel"></div><p>Loading 36,000 films…</p></div>
  </main>

  <div id="sheet" class="sheet" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="flow" class="flow" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
